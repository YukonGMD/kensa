<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kensa</title>

  <style>
    :root {
      --bg: #1e1e2e;
      --card-bg: #313244;
      --sidebar-bg: #181825;
      --text: #cdd6f4;
      --accent: #89b4fa;
      --green: #a6e3a1;
      --red: #f38ba8;
      --subtext: #a6adc8;
      --hover-bg: rgba(255, 255, 255, 0.05);
      --border: #45475a;
    }

    body.light-mode {
      --bg: #eff1f5;
      --card-bg: #e6e9ef;
      --sidebar-bg: #dce0e8;
      --text: #4c4f69;
      --accent: #1e66f5;
      --subtext: #9ca0b0;
      --border: #bcc0cc;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header-bar {
      display: flex;
      align-items: center;
      padding: 0 20px;
      height: 60px;
      background-color: var(--bg);
      border-bottom: 1px solid rgba(0,0,0,0.1);
      z-index: 50;
      flex-shrink: 0;
    }

    .menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text);
      padding: 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      min-height: 40px;
    }
    .menu-btn:hover { background-color: var(--hover-bg); }
    .menu-btn svg { width: 28px; height: 28px; fill: currentColor; }

    h1 {
      margin: 0 0 0 15px;
      font-size: 1.5rem;
      color: var(--accent);
      flex: 1;
      white-space: nowrap;
    }

    .action-btn {
      background-color: var(--green);
      color: #111;
      border: none;
      padding: 0 16px;
      height: 36px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      transition: opacity 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .action-btn:hover { opacity: 0.9; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .action-btn.red {
        background-color: var(--red);
        color: #111;
    }

    .action-btn.installed {
        background-color: var(--subtext);
        cursor: default;
        opacity: 0.7;
    }

    .sidebar-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .sidebar-overlay.active { opacity: 1; pointer-events: auto; }

    .sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 250px;
      background-color: var(--sidebar-bg);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      z-index: 101;
      padding-top: 60px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }
    .sidebar.open { transform: translateX(0); }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text);
      padding: 15px 25px;
      text-align: left;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 15px;
      border-left: 3px solid transparent;
    }
    .nav-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .nav-btn:hover { background-color: var(--hover-bg); }
    .nav-btn.active {
      background-color: var(--hover-bg);
      border-left-color: var(--accent);
      color: var(--accent);
    }

    .main-view {
      flex: 1;
      padding: 20px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .view-section { 
      display: none; 
      flex: 1; 
      height: 100%;
      flex-direction: column;
      overflow: hidden;
    }
    .view-section.active { display: flex; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      height: 100%;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      flex: 1; 
      overflow-y: auto; 
      scrollbar-width: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden; 
    }
    
    .card { overflow-y: auto; }
    .card::-webkit-scrollbar { display: none; }

    h2 {
      margin-top: 0;
      font-size: 1.1rem;
      border-bottom: 1px solid var(--subtext);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    ul { list-style: none; padding: 0; margin: 0; }

    .list-item {
      background: rgba(0,0,0,0.1);
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
    }

    .news-title {
      display: block;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 4px;
    }
    .news-title:hover { color: var(--accent); }
    .news-date { font-size: 0.8rem; color: var(--subtext); }

    .update-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ver-tag { font-family: monospace; font-size: 0.85rem; color: var(--subtext); }
    .arrow { color: var(--accent); margin: 0 6px; }

    .pkg-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    .pkg-table th { text-align: left; padding: 10px; color: var(--subtext); border-bottom: 1px solid var(--border); }
    .pkg-table td { padding: 12px 10px; border-bottom: 1px solid rgba(0,0,0,0.05); }
    
    select {
      background: #eff1f5;
      color: #111;
      border: 1px solid var(--border);
      padding: 6px;
      border-radius: 4px;
      outline: none;
      max-width: 250px;
      font-family: 'Segoe UI', sans-serif;
      font-size: 0.9rem;
    }
    option { background: #fff; color: #000; }
    body:not(.light-mode) select { background: #b0b5c4; color: #000; }

    .search-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-shrink: 0; 
      align-items: center;
    }
    .search-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    
    #search-btn {
      height: 40px;
      padding: 0 24px;
    }
    
    #search-results {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none; 
      min-height: 0; 
    }
    #search-results::-webkit-scrollbar { display: none; } 

    .search-result {
      background: rgba(0,0,0,0.1);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .result-info div:first-child { font-weight: bold; font-size: 1.1rem; }
    .result-meta { color: var(--subtext); font-size: 0.9rem; margin-top: 4px; font-family: monospace; }
    .result-desc { color: var(--text); font-size: 0.9rem; margin-top: 6px; opacity: 0.9; }

    .setting-item {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #333; transition: .3s; border-radius: 34px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(22px); }

  </style>
</head>
<body>

  <header class="header-bar">
    <button class="menu-btn" id="menu-toggle">
      <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <h1 id="page-title">Dashboard</h1>
    <button id="global-scan-btn" class="action-btn">Refresh System</button>
  </header>

  <div class="sidebar-overlay" id="overlay"></div>

  <nav class="sidebar" id="sidebar">
    <button class="nav-btn active" onclick="nav('dashboard', 'Dashboard')">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
      Dashboard
    </button>
    <button class="nav-btn" onclick="nav('installed', 'Installed')">
      <svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg>
      Installed
    </button>
    <button class="nav-btn" onclick="nav('packages', 'Packages')">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      Packages
    </button>
    <button class="nav-btn" onclick="nav('settings', 'Settings')">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.58 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      Settings
    </button>
  </nav>

  <main class="main-view">
    
    <div id="view-dashboard" class="view-section active">
      <div class="grid">
        <div class="card">
          <h2>Arch News</h2>
          <ul id="news-list">
            <li style="color: var(--subtext); padding:10px;">Loading feeds...</li>
          </ul>
        </div>
        <div class="card">
          <h2>System Updates</h2>
          <button id="dash-update-btn" class="action-btn" style="width:100%; margin-bottom:15px; display:none;">Update Now</button>
          <div id="status-msg" style="color: var(--subtext); margin-bottom:10px;">Ready.</div>
          <ul id="update-list"></ul>
        </div>
      </div>
    </div>

    <div id="view-installed" class="view-section">
      <div class="card" style="height: 100%;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
          <div style="flex:1;"></div>
          <button id="apply-pkg-btn" class="action-btn">Apply Version Changes</button>
        </div>
        <table class="pkg-table">
          <thead>
            <tr>
              <th>Package</th>
              <th>Current</th>
              <th>Version</th>
              <th style="width: 50px;"></th>
            </tr>
          </thead>
          <tbody id="pkg-body"></tbody>
        </table>
        <div id="pkg-empty" style="text-align:center; padding:30px; color:var(--subtext);">
          Loading packages...
        </div>
      </div>
    </div>

    <div id="view-packages" class="view-section">
      <div class="card" style="height: 100%;">
        <div class="search-container">
          <input type="text" id="search-input" class="search-input" placeholder="Search Arch Repositories...">
          <button id="search-btn" class="action-btn">Search</button>
        </div>
        <div id="search-results">
          <div style="text-align:center; padding:20px; color:var(--subtext);">
            Enter a package name above.
          </div>
        </div>
      </div>
    </div>

    <div id="view-settings" class="view-section">
      <div class="card" style="height: 100%;">
        <div class="setting-item">
          <div>
            <strong>Dark Mode</strong>
            <div style="font-size:0.85rem; color:var(--subtext);">Toggle application theme</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-theme" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-item">
          <div>
            <strong>Auto-Scan</strong>
            <div style="font-size:0.85rem; color:var(--subtext);">Check for updates on startup</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-autoscan">
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-item">
          <div>
            <strong>Notifications</strong>
            <div style="font-size:0.85rem; color:var(--subtext);">Show desktop alerts (Experimental)</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="toggle-notifications">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

  </main>

  <script>
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
        e.preventDefault();
      }
    });
    
    document.addEventListener('wheel', function(e) {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
      }
    }, { passive: false });

    const { invoke } = window.__TAURI__.core;
    
    let cachedData = [];
    const overlay = document.getElementById('overlay');
    const sidebar = document.getElementById('sidebar');
    const menuToggle = document.getElementById('menu-toggle');
    const pageTitle = document.getElementById('page-title');
    
    menuToggle.onclick = () => {
      sidebar.classList.add('open');
      overlay.classList.add('active');
    };

    overlay.onclick = () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    };

    window.nav = (viewName, displayName) => {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + viewName).classList.add('active');
      
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      event.currentTarget.classList.add('active');
      
      pageTitle.innerText = displayName;

      sidebar.classList.remove('open');
      overlay.classList.remove('active');

      if(viewName === 'installed') loadAllPackages();
    };

    const scanBtn = document.getElementById('global-scan-btn');
    const statusEl = document.getElementById('status-msg');
    const dashUpdateBtn = document.getElementById('dash-update-btn');
    const updateList = document.getElementById('update-list');
    const newsList = document.getElementById('news-list');

    async function fetchNews() {
      const timeout = new Promise((_, reject) =>
        setTimeout(() => reject(new Error("Timeout")), 10000)
      );

      try {
        const items = await Promise.race([
          invoke('get_news'),
          timeout
        ]);
        
        newsList.innerHTML = '';
        items.forEach(i => {
          const li = document.createElement('li');
          li.className = 'list-item';
          
          const titleSpan = document.createElement('span');
          titleSpan.className = 'news-title';
          titleSpan.textContent = i.title + " ↗";
          titleSpan.onclick = () => invoke('open_link', {url: i.link});
          
          const dateDiv = document.createElement('div');
          dateDiv.className = 'news-date';
          dateDiv.textContent = i.pub_date;
          
          li.append(titleSpan, dateDiv);
          newsList.appendChild(li);
        });
      } catch {
        newsList.innerHTML = '<li style="padding:10px; color:var(--subtext);">News feed unavailable.</li>';
      }
    }

    async function scanSystem() {
      scanBtn.disabled = true;
      scanBtn.innerText = 'Scanning...';
      statusEl.innerText = ' querying databases...';
      updateList.innerHTML = '';
      dashUpdateBtn.style.display = 'none';

      try {
        const data = await invoke('get_updates');
        statusEl.innerText = `Found ${data.length} updates available.`;

        if (data.length > 0) {
          dashUpdateBtn.style.display = 'block';
          if (localStorage.getItem('kensa_notifications') === 'true') {
             invoke('send_notification', { title: "Updates Found", body: `Kensa found ${data.length} available updates.` });
          }
        }

        data.forEach(pkg => {
          const li = document.createElement('li');
          li.className = 'list-item';
          
          const row = document.createElement('div');
          row.className = 'update-row';
          
          const nameStrong = document.createElement('strong');
          nameStrong.textContent = pkg.name;
          
          const verDiv = document.createElement('div');
          verDiv.className = 'ver-tag';
          
          const oldVerText = document.createTextNode(pkg.old_version + ' ');
          const arrowSpan = document.createElement('span');
          arrowSpan.className = 'arrow';
          arrowSpan.textContent = '➜';
          const newVerText = document.createTextNode(' ' + pkg.new_version);
          
          verDiv.append(oldVerText, arrowSpan, newVerText);
          row.append(nameStrong, verDiv);
          li.appendChild(row);
          updateList.appendChild(li);
        });

      } catch {
        statusEl.innerText = 'Error checking updates.';
      } finally {
        scanBtn.disabled = false;
        scanBtn.innerText = 'Refresh System';
      }
    }

    async function loadAllPackages() {
        const tbody = document.getElementById('pkg-body');
        const empty = document.getElementById('pkg-empty');
        
        tbody.innerHTML = '';
        empty.style.display = 'block';
        empty.innerText = 'Loading packages...';

        try {
            const data = await invoke('get_installed_packages');
            cachedData = data; 
            
            if (data.length === 0) {
                empty.innerText = 'No packages found.';
                return;
            }
            empty.style.display = 'none';

            data.forEach(p => {
                const tr = document.createElement('tr');
                
                const tdName = document.createElement('td');
                const nameStrong = document.createElement('strong');
                nameStrong.textContent = p.name;
                tdName.appendChild(nameStrong);
                
                const tdVer = document.createElement('td');
                tdVer.style.color = 'var(--subtext)';
                tdVer.style.fontFamily = 'monospace';
                tdVer.textContent = p.version;
                
                const tdAction = document.createElement('td');
                const select = document.createElement('select');
                select.className = 'pkg-action-select';
                select.dataset.name = p.name;
                select.onchange = () => handlePkgSelect(select);
                
                const optCurrent = document.createElement('option');
                optCurrent.value = 'current';
                optCurrent.selected = true;
                optCurrent.textContent = `Current (${p.version})`;
                select.appendChild(optCurrent);
                
                if(p.cached_versions) {
                    p.cached_versions.forEach(fname => {
                       const opt = document.createElement('option');
                       opt.value = fname;
                       opt.textContent = `Downgrade (Cache): ${fname}`;
                       select.appendChild(opt);
                    });
                }
                
                const optRemote = document.createElement('option');
                optRemote.value = 'fetch_remote';
                optRemote.textContent = '🔎 Search Arch Archive...';
                select.appendChild(optRemote);
                
                tdAction.appendChild(select);
                
                const tdDelete = document.createElement('td');
                const btnDel = document.createElement('button');
                btnDel.className = 'action-btn red';
                btnDel.style.padding = '0 12px';
                btnDel.style.height = '30px';
                btnDel.textContent = '×';
                btnDel.onclick = () => uninstallPackage(p.name, btnDel);
                tdDelete.appendChild(btnDel);

                tr.append(tdName, tdVer, tdAction, tdDelete);
                tbody.appendChild(tr);
            });
        } catch (e) {
            empty.innerText = 'Error loading packages.';
        }
    }

    async function handlePkgSelect(selectEl) {
        if (selectEl.value === 'fetch_remote') {
            const pkgName = selectEl.getAttribute('data-name');
            selectEl.options[selectEl.selectedIndex].text = "Fetching...";
            selectEl.disabled = true;

            try {
                const urls = await invoke('fetch_package_history', { name: pkgName });
                selectEl.remove(selectEl.selectedIndex);
                selectEl.disabled = false;

                if (urls.length === 0) {
                    alert("No remote versions found in Archive.");
                    selectEl.value = "current";
                    return;
                }

                urls.forEach(url => {
                    const filename = url.split('/').pop();
                    const option = document.createElement('option');
                    option.value = url;
                    option.textContent = `Downgrade (Web): ${filename}`;
                    selectEl.add(option);
                });
                
                selectEl.value = urls[0];

            } catch (e) {
                alert("Failed to fetch history: " + e);
                selectEl.disabled = false;
                selectEl.value = "current";
            }
        }
    }

    async function applyPackageChanges() {
        const btn = document.getElementById('apply-pkg-btn');
        btn.innerText = 'Processing...';
        btn.disabled = true;

        const selects = document.querySelectorAll('.pkg-action-select');
        let targets = [];

        selects.forEach(s => {
            if (s.value !== 'current') {
                if (s.value.startsWith('http')) {
                    targets.push(s.value);
                } else {
                    targets.push("/var/cache/pacman/pkg/" + s.value);
                }
            }
        });

        if (targets.length === 0) {
            alert("No changes selected.");
            btn.innerText = 'Apply Version Changes';
            btn.disabled = false;
            return;
        }

        await invoke('manage_packages', { action: 'upgrade_file', packages: targets });
        
        btn.innerText = 'Apply Version Changes';
        btn.disabled = false;
        loadAllPackages(); 
    }

    async function triggerUpdate() {
      const btn = document.getElementById('dash-update-btn');
      btn.innerText = 'Terminal Open...';
      btn.disabled = true;
      await invoke('manage_packages', { action: 'update_all', packages: [] });
      btn.innerText = 'Update Now';
      btn.disabled = false;
      if (localStorage.getItem('kensa_notifications') === 'true') {
         invoke('send_notification', { title: "System Update", body: "Update process finished." });
      }
      scanSystem();
    }

    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const searchResults = document.getElementById('search-results');

    async function performSearch() {
        const query = searchInput.value.trim();
        if(!query) return;

        searchResults.innerHTML = '<div style="text-align:center; padding:20px; color:var(--subtext);">Searching repositories...</div>';
        searchBtn.disabled = true;

        try {
            const results = await invoke('search_packages', { query });
            searchResults.innerHTML = '';
            
            if(results.length === 0) {
                searchResults.innerHTML = '<div style="text-align:center; padding:20px; color:var(--subtext);">No packages found.</div>';
            } else {
                results.forEach(pkg => {
                    const div = document.createElement('div');
                    div.className = 'search-result';
                    
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'result-info';
                    
                    const nameDiv = document.createElement('div');
                    nameDiv.textContent = pkg.name;
                    
                    const metaDiv = document.createElement('div');
                    metaDiv.className = 'result-meta';
                    metaDiv.textContent = `${pkg.repo} / ${pkg.version}`;
                    
                    const descDiv = document.createElement('div');
                    descDiv.className = 'result-desc';
                    descDiv.textContent = pkg.description;
                    
                    infoDiv.append(nameDiv, metaDiv, descDiv);
                    
                    const btn = document.createElement('button');
                    if (pkg.installed) {
                        btn.className = 'action-btn red';
                        btn.textContent = 'Uninstall';
                        btn.onclick = () => uninstallPackage(pkg.name, btn);
                    } else {
                        btn.className = 'action-btn';
                        btn.textContent = 'Install';
                        btn.onclick = () => installPackage(pkg.name, btn);
                    }
                    
                    div.append(infoDiv, btn);
                    searchResults.appendChild(div);
                });
            }
        } catch(e) {
            searchResults.innerHTML = `<div style="text-align:center; padding:20px; color:var(--red);">Search failed: ${e}</div>`;
        } finally {
            searchBtn.disabled = false;
        }
    }

    window.installPackage = async (pkgName, btnEl) => {
        const confirmInstall = confirm(`Install ${pkgName}? This will open a terminal.`);
        if(confirmInstall) {
            const origText = btnEl.innerText;
            btnEl.innerText = "Installing...";
            btnEl.disabled = true;
            
            await invoke('manage_packages', { action: 'install', packages: [pkgName] });
            
            const isInstalled = await invoke('check_is_installed', { name: pkgName });
            if (isInstalled) {
                btnEl.innerText = "Uninstall";
                btnEl.className = "action-btn red";
                btnEl.onclick = () => uninstallPackage(pkgName, btnEl);
                btnEl.disabled = false;
            } else {
                btnEl.innerText = origText;
                btnEl.disabled = false;
            }
        }
    };

    window.uninstallPackage = async (pkgName, btnEl) => {
        const confirmUninstall = confirm(`Are you sure you want to uninstall ${pkgName}?`);
        if(confirmUninstall) {
            const origText = btnEl.innerText;
            btnEl.innerText = "Removing...";
            btnEl.disabled = true;
            
            await invoke('manage_packages', { action: 'remove', packages: [pkgName] });
            
            const isInstalled = await invoke('check_is_installed', { name: pkgName });
            if (!isInstalled) {
                if (btnEl.innerText !== "×") {
                    btnEl.innerText = "Install";
                    btnEl.className = "action-btn";
                    btnEl.onclick = () => installPackage(pkgName, btnEl);
                    btnEl.disabled = false;
                } else {
                    loadAllPackages();
                }
            } else {
                btnEl.innerText = origText;
                btnEl.disabled = false;
            }
        }
    };

    searchBtn.onclick = performSearch;
    searchInput.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') performSearch();
    });

    dashUpdateBtn.onclick = triggerUpdate;
    scanBtn.onclick = scanSystem;
    document.getElementById('apply-pkg-btn').onclick = applyPackageChanges;

    const themeToggle = document.getElementById('toggle-theme');
    const autoScanToggle = document.getElementById('toggle-autoscan');
    const notifToggle = document.getElementById('toggle-notifications');

    themeToggle.onchange = (e) => {
      if(!e.target.checked) document.body.classList.add('light-mode');
      else document.body.classList.remove('light-mode');
      localStorage.setItem('kensa_theme', e.target.checked ? 'dark' : 'light');
    };

    autoScanToggle.onchange = (e) => {
      localStorage.setItem('kensa_autoscan', e.target.checked);
    };

    notifToggle.onchange = (e) => {
      localStorage.setItem('kensa_notifications', e.target.checked);
    };

    if (localStorage.getItem('kensa_theme') === 'light') {
      document.body.classList.add('light-mode');
      themeToggle.checked = false;
    }

    if (localStorage.getItem('kensa_autoscan') === 'true') {
      autoScanToggle.checked = true;
      scanSystem();
    }

    if (localStorage.getItem('kensa_notifications') === 'true') {
      notifToggle.checked = true;
    }

    fetchNews();
  </script>

  <script src="https://panzi.github.io/Browser-Ponies/basecfg.js"></script>
  <script src="https://panzi.github.io/Browser-Ponies/browserponies.js"></script>
  <script>
    let poniesEnabled = false;
    
    (function (cfg) {
      BrowserPonies.setBaseUrl(cfg.baseurl);
      BrowserPonies.loadConfig(BrowserPoniesBaseConfig);
      BrowserPonies.loadConfig(cfg);
    })({
      baseurl: "https://panzi.github.io/Browser-Ponies/",
      fadeDuration: 500,
      volume: 1,
      fps: 25,
      speed: 3,
      audioEnabled: false,
      showFps: false,
      showLoadProgress: true,
      speakProbability: 0.1,
      spawn: {
        "applejack": 1,
        "fluttershy": 1,
        "pinkie pie": 1,
        "rainbow dash": 1,
        "rarity": 1,
        "twilight sparkle": 1
      },
      autostart: false
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
      
      if (e.key.toLowerCase() === "p") {
        poniesEnabled = !poniesEnabled;
        poniesEnabled ? BrowserPonies.start() : BrowserPonies.stop();
      }
    });
  </script>
